name: Build Chess Analyzer APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Download Stockfish 19
        run: |
          mkdir -p app/src/main/assets
          curl -fL https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-arm64-universal.tar.gz -o stockfish.tar.gz
          tar -xzf stockfish.tar.gz
          cp stockfish/stockfish-android-arm64-universal app/src/main/assets/stockfish
          chmod 755 app/src/main/assets/stockfish
          ls -lh app/src/main/assets/stockfish

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Analyzer-APK
          path: app/build/outputs/apk/debug/*.apk
