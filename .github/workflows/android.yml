name: Build Chess Analyzer APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Download Stockfish WASM
        run: |
          mkdir -p .engine-package app/src/main/assets
          npm pack stockfish@19.0.1 --pack-destination .engine-package --silent
          tar -xzf .engine-package/stockfish-19.0.1.tgz -C .engine-package
          cp .engine-package/package/bin/stockfish-19-lite-single.js app/src/main/assets/
          cp .engine-package/package/bin/stockfish-19-lite-single.wasm app/src/main/assets/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Analyzer-APK
          path: app/build/outputs/apk/debug/*.apk
